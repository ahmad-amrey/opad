# Solver packs: OpenFOAM and CalculiX for Windows x64, Linux x64 and macOS (Apple silicon), built from their pinned sources
# by the recipes in engines/ (engines/<id>/make-pack.sh) for Simulate's Install button (core/src/sim/engine_packs.cpp pins
# each pack's URL, size and SHA-256), each checked by engines/<id>/smoke.sh on its own system.
#
# A pull request touching engines/ builds and checks every pack and publishes nothing: each pack, its exact sources, the
# recipe and SHA256SUMS are the run's artifact engine-<id>-<platform>, kept 30 days. On dev (the merge, or Run workflow with
# "publish"), every pack revision whose release does not exist yet is published: one release per pack revision with every
# system's zip, tag engines-<id>-<version>-<rev> on dev's commit, never marked latest (the update check reads
# releases/latest and both its lists skip tags that are not OPAD versions), notes = the packs' NOTICE.txt, the sources
# once, each system's recipe, one SHA256SUMS (engines/ci/publish.sh). Build once: a pack built by the pull request's run of
# exactly this code (same git tree: the pull request was up to date with dev) is published from that run, not built again,
# and one published before as a release of its own system (engines-<id>-<version>-<rev>-<platform>, the first packs) is
# taken from there (engines/ci/plan.sh). A published tag is never replaced: a change to a pack is a new revision
# (PACK_REV in its make-pack.sh). The pins in engine_packs.cpp follow in the
# next commit (docs/releasing.md, "Solver packs"). Tags of that shape start no ci.yml run (it takes v* only), and its
# pruning of development builds only ever deletes vX.Y.Z-dev.N / -rc.N releases.
name: engines
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Solver packs: build and check for pull request #{0}', github.event.pull_request.number)
    || (github.event_name == 'push' || inputs.publish)
      && format('Solver packs: publish the new revisions from {0}', github.ref_name)
    || format('Solver packs: build and check {0} on {1} (nothing published)', inputs.pack, github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Which pack to build
        type: choice
        options: [both, openfoam, calculix]
        default: both
      publish:
        description: Publish the packs whose release does not exist yet (dev only)
        type: boolean
        default: false
  pull_request:
    paths: ["engines/**", ".github/workflows/engines.yml"]
  push:
    branches: [dev]
    paths: ["engines/**", ".github/workflows/engines.yml"]

permissions:
  contents: read
  actions: read  # the plan looks for earlier runs' packs

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a publishing run on dev always finishes

env:
  ARTIFACT_DAYS: 30  # long enough for a pull request's review: the merge into dev publishes these very packs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # a pull request's head: its tree is what dev gets
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PACKS: ${{ inputs.pack || 'both' }}
          PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && 'true' || 'false' }}
        run: bash engines/ci/plan.sh

  build:
    name: ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tools
        if: runner.os != 'Windows'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          apt() { sudo apt-get update -qq && sudo apt-get install -y -qq "$@"; }
          case "${{ matrix.key }}" in
            # libfl-dev: FlexLexer.h (only a Recommends of flex, which the runner leaves out)
            openfoam-windows-x64) apt mingw-w64 flex libfl-dev bison m4 make cmake curl ccache ;;
            openfoam-linux-x64) apt g++ flex libfl-dev bison m4 make cmake curl ccache patchelf ;;
            calculix-linux-x64) apt gcc gfortran libopenblas-dev libarpack2-dev cmake ninja-build curl ;;
            # bash 5 (OpenFOAM's scripts; macOS has 3.2), GNU make, flex and bison newer than Xcode's
            openfoam-macos-arm64) brew install bash make flex bison ccache ;;
            calculix-macos-arm64) brew install bash gcc arpack openblas ninja ;;
          esac
      - if: matrix.key == 'calculix-windows-x64'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64  # msvcrt, as the OpenFOAM pack: ccx.exe then needs only KERNEL32 and msvcrt
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-arpack mingw-w64-x86_64-openblas
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja curl patch bzip2 tar unzip
      # The compiled objects of earlier runs (the recipe turns wmake's ccache on when ccache is there): a run whose recipe
      # changed little compiles little. About 0.2 GB per system, so every run saves it (a pull request's own runs, and
      # dev's, which every pull request can read); the key is the recipe's hash, so an unchanged recipe saves nothing new.
      - name: Restore the compiler cache
        if: matrix.id == 'openfoam'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.key }}-${{ hashFiles('engines/openfoam/**') }}
          restore-keys: ccache-${{ matrix.key }}-
      - name: A case-sensitive volume (OpenFOAM's sources need one)
        if: matrix.key == 'openfoam-macos-arm64'
        run: |
          hdiutil create -size 30g -fs "Case-sensitive APFS" -volname ofbuild -type SPARSEBUNDLE "$RUNNER_TEMP/ofbuild"
          hdiutil attach "$RUNNER_TEMP/ofbuild.sparsebundle"  # at /Volumes/ofbuild
          [ -d /Volumes/ofbuild ]
          echo "WORK=/Volumes/ofbuild/openfoam" >> "$GITHUB_ENV"
      - name: Build the pack
        if: matrix.key != 'calculix-windows-x64'
        shell: bash
        env:
          CCACHE_MAXSIZE: 3G
          TARGET: ${{ matrix.id == 'openfoam' && matrix.platform || '' }}
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache"
          work="${WORK:-$RUNNER_TEMP/${{ matrix.id }}}"
          sh=bash
          if [ "$RUNNER_OS" = macOS ]; then sh="$(brew --prefix)/bin/bash"; fi
          JOBS=$(getconf _NPROCESSORS_ONLN) "$sh" engines/${{ matrix.id }}/make-pack.sh "$work" out $TARGET 2>&1 | tee build.log
          if command -v ccache > /dev/null; then ccache -s || true; fi
      - name: Build the pack (MSYS2)
        if: matrix.key == 'calculix-windows-x64'
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash engines/calculix/make-pack.sh "$RUNNER_TEMP/calculix" out 2>&1 | tee build.log
      - name: Save the compiler cache
        if: always() && matrix.id == 'openfoam'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.key }}-${{ hashFiles('engines/openfoam/**') }}
      - name: The pack runs here
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: bash engines/${{ matrix.id }}/smoke.sh out "$RUNNER_TEMP/smoke"
      - name: The pack runs here (MSYS2)
        if: matrix.key == 'calculix-windows-x64'
        shell: msys2 {0}
        run: bash engines/calculix/smoke.sh out "$RUNNER_TEMP/smoke"
      - name: Build log on failure
        if: failure()
        shell: bash
        run: tail -200 "${WORK:-$RUNNER_TEMP/${{ matrix.id }}}/build.log" || true
      # Only a pack that ran on its own system becomes engine-<id>-<platform>, what dev publishes. The Windows OpenFOAM,
      # built on Linux, is handed to the next job to run on Windows first.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.key == 'openfoam-windows-x64' && 'built-openfoam-windows-x64' || matrix.artifact }}
          path: out/
          if-no-files-found: error
          retention-days: ${{ matrix.key == 'openfoam-windows-x64' && 1 || env.ARTIFACT_DAYS }}

  openfoam-windows-runs:
    name: openfoam-windows-x64 runs on Windows
    needs: [plan, build]
    if: ${{ !cancelled() && contains(needs.plan.outputs.build, '"key":"openfoam-windows-x64"') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-openfoam-windows-x64
          path: out
      - name: The pack runs here (no MPI installed)
        shell: bash
        run: bash engines/openfoam/smoke.sh out "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-openfoam-windows-x64
          path: out/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_DAYS }}

  publish:
    name: publish ${{ matrix.tag }}
    needs: [plan, build, openfoam-windows-runs]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish != '[]' }}
    strategy:
      fail-fast: false  # each pack revision is a release of its own
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the release and its tag
      actions: read    # earlier runs' artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every system's pack (from where the plan found it) in one release; the sizes and SHA-256s to pin in the summary.
      - name: Publish ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          TARGET: ${{ matrix.target }}
          TITLE: ${{ matrix.title }}
          PARTS: ${{ toJSON(matrix.parts) }}
        run: bash engines/ci/publish.sh
