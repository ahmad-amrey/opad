# Solver packs: OpenFOAM and CalculiX built from their pinned sources by the recipes in engines/ (engines/<id>/make-pack.sh),
# for Simulate's Install button (core/src/sim/engine_packs.cpp pins each pack's URL, size and SHA-256). This workflow only
# builds: each pack, its exact sources, the recipe and SHA256SUMS are the run's artifacts. Publishing is a person's step,
# done by hand from a run's artifacts (docs/releasing.md, "Solver packs"): a release tagged engines-<id>-<version>-<rev>,
# never marked latest (the update check reads releases/latest and its list skips tags that are not versions), and the
# SHA256SUMS of that run pinned in engine_packs.cpp. Tags of that shape do not start ci.yml (it takes v* only).
name: engines

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Which pack to build
        type: choice
        options: [both, openfoam, calculix]
        default: both
  pull_request:
    paths: ["engines/**", ".github/workflows/engines.yml"]

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openfoam-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.pack != 'calculix'
    # OpenCFD's own way to Windows: cross-compiled on Linux with mingw-w64, no MPI (Pstream's dummy library).
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 flex bison m4 make cmake curl
      - name: Build the pack
        run: |
          set -o pipefail
          JOBS=$(nproc) bash engines/openfoam/make-pack.sh "$RUNNER_TEMP/openfoam" out 2>&1 | tee build.log
      - name: Build log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/openfoam/build.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-openfoam-windows-x64
          path: out/
          if-no-files-found: error

  calculix-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.pack != 'openfoam'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64  # msvcrt, as the OpenFOAM pack: ccx.exe then needs only KERNEL32 and msvcrt
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-arpack mingw-w64-x86_64-openblas
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja curl patch bzip2 tar unzip
      - name: Build the pack
        run: |
          set -o pipefail
          bash engines/calculix/make-pack.sh "$RUNNER_TEMP/calculix" out 2>&1 | tee build.log
      - name: The pack's ccx solves a cantilever
        run: |
          set -e
          mkdir -p check && cd check
          unzip -q ../out/opad-calculix-*-windows-x64.zip -d pack
          printf '%s\n' '*NODE,NSET=N' '1,0,0,0' '2,1,0,0' '3,1,1,0' '4,0,1,0' '5,0,0,1' '6,1,0,1' '7,1,1,1' '8,0,1,1' \
            '*ELEMENT,TYPE=C3D8,ELSET=E' '1,1,2,3,4,5,6,7,8' '*MATERIAL,NAME=S' '*ELASTIC' '210000,0.3' '*SOLID SECTION,ELSET=E,MATERIAL=S' \
            '*BOUNDARY' '1,1,3' '4,1,3' '5,1,3' '8,1,3' '*STEP' '*STATIC' '*CLOAD' '2,3,1.' '3,3,1.' '6,3,1.' '7,3,1.' '*NODE PRINT,NSET=N' 'U' '*END STEP' > job.inp
          ./pack/bin/ccx.exe -i job | tail -5
          grep -q "displacements" job.dat
          # the loaded corner moved, written with two-digit exponents as on Linux (the .frd columns need them: patches/0001)
          grep -E "^ +2 +[0-9]\.[0-9]+E[+-][0-9]{2} " job.dat
      - name: Build log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/calculix/build.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-calculix-windows-x64
          path: out/
          if-no-files-found: error
